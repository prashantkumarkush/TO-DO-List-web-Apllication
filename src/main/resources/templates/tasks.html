<!DOCTYPE html>
<html lang = "en" xmlns:th = "https://www.thymleaf.org">
<head>
<meta charset="UTF-8">
<title>Todo Application</title>
<link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/css/bootstrap.min.css" rel="stylesheet" integrity="sha384-sRIl4kxILFvY47J16cr9ZwB07vP4J8+LH7qKQnuqkuIAvNWLzeN8tE5YBujZqJLB" crossorigin="anonymous">
  <style >
     .text-strikethrough{
         text-decoration:line-through;
         color:red;
     }
  </style>
</head>
<body>
  
  <div class="container">
     <h1 class="mt-5 text-center">todo application</h1>
       <form action="/" method ="post" class="row mt-3">
       
	       <div class="col-md-10">
	       <input class="form-control form-control-lg" type="text" name="title" placeholder="add a new task..." required>
	       </div>
	       
	       <div class="col-md-2">
	         <button type="submit" class="btn btn-primary btn-lg btn-block"> Add </button>
	       </div>
       
       </form>
       <div>
       
       <th:block th:each = "task : ${tasks}">
    			 <div class="card mb-2"> 
    			   <div class="card-body d-file justify-content-between align-items-center">   			   
    			    <span th:classappend="${task.completed} ? 'text-strikethrough'" th:text = "${task.title}">Task Title</span>
    			    
    			    <div>
    			        <a th:href="@{/{id}/toggle(id=${task.id})}" class="btn  btn-outline-secondary btn-sm">completed</a>
    			         <a th:href="@{/{id}/delete(id=${task.id})}" class="btn btn-outline-secondary btn-sm ml-2">Delete</a>
    			         
    			    </div>
    			   </div>
    			      
    			 </div>
    	 </th:block>
    	 
    	 </div>
    	
  </div>
</body>
</html>
